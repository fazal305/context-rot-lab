<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Context Rot Lab — an interactive playground exploring how large, noisy AI context degrades output quality, plus tools to shrink context before sending it to an AI assistant." />
    <title>Context Rot Lab</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("context-rot-lab:theme-preference");
          var pref = raw ? JSON.parse(raw) : "dark";
          var resolved =
            pref === "system"
              ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
              : pref;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
