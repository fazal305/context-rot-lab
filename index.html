    <script type="text/javascript">
      // Counterpart to public/404.html's redirect: restores the real path
      // (encoded in the query string) via history.replaceState before
      // React Router mounts, so deep links work on GitHub Pages.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("context-rot-lab:theme-preference");
          var pref = raw ? JSON.parse(raw) : "dark";
          var resolved =
            pref === "system"
              ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
              : pref;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

    <div id="root"></div>

  </body>
