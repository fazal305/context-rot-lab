<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Context Rot Lab</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites for client-side routes, so a
      // direct visit or refresh on e.g. /context-rot-lab/context-rot 404s at
      // the host level. This redirects that 404 back to index.html with the
      // intended path encoded in the query string; index.html's inline
      // script (see below) restores it via history.replaceState before
      // React Router ever sees it. Standard trick: rafgraph/spa-github-pages.
      var pathSegmentsToKeep = 1; // keep "/context-rot-lab"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
